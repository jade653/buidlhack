[package]
name = "agent-challenge-contract"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.21.0"
serde = { version = "1.0", features = ["derive"] }
hex = { version = "0.4", features = ["alloc"] }
# shade-attestation lives inside the shade-agent-framework monorepo workspace.
# Cargo resolves workspace members by crate name from the git URL.
shade-attestation = { git = "https://github.com/NearDeFi/shade-agent-framework.git" }

[dev-dependencies]
near-sdk   = { version = "5.24.0", features = ["unit-testing"] }
near-workspaces = "0.15"
tokio      = { version = "1", features = ["full"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level     = "z"
lto           = true
debug         = false
panic         = "abort"
overflow-checks = true
